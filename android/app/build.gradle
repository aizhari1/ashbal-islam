plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashbal.islam'
    compileSdk 35

    defaultConfig {
        applicationId "com.ashbal.islam"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    // توقيع debug حتى يتثبت الـ APK على الموبايل بدون keystore خاص
    signingConfigs {
        releaseDebug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // لو مفيش debug.keystore لسه، Gradle هيعمل واحد تلقائي في debug
            signingConfig signingConfigs.debug
        }
        debug {
            // بدون suffix عشان نفس اسم الحزمة
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
