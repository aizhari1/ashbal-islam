name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'android/**'
      - 'app.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  app-icon:
    name: Logo → App icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official logo into repo
        run: |
          set -e
          mkdir -p public assets/generated dist
          # المصدر: الشعار الرسمي (تم رفعه من صورة المستخدم)
          curl -fsSL -o public/logo.jpg \
            "https://bmemllsjduxlqmwnpfya.supabase.co/storage/v1/object/public/brand/logo.jpg"
          cp public/logo.jpg assets/generated/logo.jpg
          cp public/logo.jpg dist/logo.jpg
          ls -la public/logo.jpg

      - name: Generate PWA + Android launcher icons
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert public/logo.jpg -resize 512x512 public/icon-512.png
          convert public/logo.jpg -resize 192x192 public/icon-192.png
          convert public/logo.jpg -resize 512x512 assets/generated/icon-512.png
          convert public/logo.jpg -resize 192x192 assets/generated/icon-192.png
          cp assets/generated/icon-512.png dist/app-icon.png

          if [ -d android/app/src/main/res ]; then
            mkdir -p android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
            convert public/logo.jpg -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert public/logo.jpg -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert public/logo.jpg -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert public/logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert public/logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp android/app/src/main/res/mipmap-$d/ic_launcher.png \
                 android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
            echo "Android ic_launcher updated"
          else
            echo "No android/ folder yet — icons ready in dist/ and public/"
          fi

      - name: Commit logo into GitHub repo (public/logo.jpg)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/logo.jpg public/icon-192.png public/icon-512.png assets/generated/ || true
          if git diff --cached --quiet; then
            echo "No logo changes to commit"
          else
            git commit -m "chore: app logo + icons from official brand image"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ashbal-app-icons
          path: |
            public/logo.jpg
            public/icon-192.png
            public/icon-512.png
            assets/generated/
            dist/
