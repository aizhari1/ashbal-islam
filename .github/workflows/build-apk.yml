name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web
        run: |
          if grep -q '"build"' package.json; then npm run build || true; fi

      - name: Notes
        run: |
          mkdir -p dist
          if [ ! -d android ]; then
            echo "Workflow جاهز. أضف مجلد android أو Expo لبناء APK كامل." > dist/README.txt
          else
            echo "android موجود — يمكن إضافة خطوات gradle هنا." > dist/README.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-notes
          path: dist/
          if-no-files-found: ignore
