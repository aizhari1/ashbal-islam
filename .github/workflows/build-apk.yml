name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK with official logo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip imagemagick
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses & install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate launcher icons from official logo
        run: |
          set -e
          LOGO_URL="https://bmemllsjduxlqmwnpfya.supabase.co/storage/v1/object/public/brand/logo.jpg"
          curl -fsSL -o /tmp/logo.jpg "$LOGO_URL"
          identify /tmp/logo.jpg

          make_icon() {
            dens="$1"; sz="$2"
            dir="android/app/src/main/res/mipmap-${dens}"
            mkdir -p "$dir"
            convert /tmp/logo.jpg -trim +repage -resize ${sz}x${sz} \
              -background white -gravity center -extent ${sz}x${sz} \
              "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            echo "icon $dens ${sz}px"
          }

          make_icon mdpi 48
          make_icon hdpi 72
          make_icon xhdpi 96
          make_icon xxhdpi 144
          make_icon xxxhdpi 192

          # لا نستخدم adaptive-icon يشير لنفسه — PNG فقط
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true

          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: Setup Gradle Wrapper
        working-directory: android
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found: $APK"
          ls -la "$APK"
          cp "$APK" ashbal-islam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ashbal-islam-apk
          path: ashbal-islam.apk
          if-no-files-found: error
