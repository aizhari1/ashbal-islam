name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK with official logo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate launcher icons from official logo
        run: |
          set -e
          LOGO_URL="https://bmemllsjduxlqmwnpfya.supabase.co/storage/v1/object/public/brand/logo.jpg"
          curl -fsSL -o /tmp/logo.jpg "$LOGO_URL"
          identify /tmp/logo.jpg

          # mipmap densities
          declare -A SIZES=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            sz=${SIZES[$dens]}
            dir="android/app/src/main/res/mipmap-${dens}"
            mkdir -p "$dir"
            # square launcher
            convert /tmp/logo.jpg -trim +repage -resize ${sz}x${sz} \
              -background white -gravity center -extent ${sz}x${sz} \
              "$dir/ic_launcher.png"
            # round (same image; Android masks it)
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            echo "generated $dir ($sz px)"
          done

          # also adaptive icon foreground (API 26+)
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML

          ls -la android/app/src/main/res/mipmap-*/

      - name: Setup Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 || true
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"
          cp "$APK" ashbal-islam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ashbal-islam-apk
          path: ashbal-islam.apk
          if-no-files-found: error
